; Конфигурация поисковой системы

[database]
host = localhost
port = 5432
dbname = search_engine
user = postgres
password = postgres

[indexer]
; Каталог, с которого начинается индексация (обходится рекурсивно).
; Относительный путь отсчитывается от текущего каталога при запуске.
; Пример для Windows: start_directory = "C:\Work\Documents"
start_directory = ./test_data
; Расширения файлов через запятую
extensions = txt,md,ini,csv
; Число потоков индексации, 0 — по числу ядер процессора
threads = 0

[search]
; Сколько результатов показывать
max_results = 10
; Максимальное число слов в запросе
max_query_words = 4
